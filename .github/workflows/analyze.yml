name: extract-melody

on:
  workflow_dispatch:
    inputs:
      song_url:
        description: 'קישור להקלטה (או נתיב בתוך הריפו, למשל songs/shir.m4a)'
        required: true
      separate:
        description: 'יש ליווי בהקלטה? (הפרדת שירה עם Demucs - איטי)'
        type: boolean
        default: false
      lyrics:
        description: 'תמלול מילים עם זמנים (Whisper)'
        type: boolean
        default: false
      style:
        description: 'סגנון העיבוד (השאר ריק = המודל יזהה לבד מההקלטה)'
        required: false
        default: ''
      gemini_model:
        description: 'מודל Gemini לתכנון העיבוד'
        required: false
        default: 'gemini-2.5-flash'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages (CPU only)
        env:
          SEPARATE: ${{ inputs.separate }}
          LYRICS: ${{ inputs.lyrics }}
        run: |
          pip install -r requirements.txt
          if [ "$SEPARATE" = "true" ]; then
            pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install demucs==4.0.1
          fi
          if [ "$LYRICS" = "true" ]; then pip install faster-whisper; fi

      - name: Cache Demucs model
        if: ${{ inputs.separate }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs-v1

      - name: Get the recording
        env:
          SONG_URL: ${{ inputs.song_url }}
        run: |
          case "$SONG_URL" in
            http*)
              # המרת קישור blob של גיטהאב לקישור raw
              URL=$(echo "$SONG_URL" | sed -E 's#https://github.com/(.*)/blob/#https://raw.githubusercontent.com/\1/#')
              curl -L --fail --retry 3 "$URL" -o input_song
              ;;
            *)
              cp "$SONG_URL" input_song
              ;;
          esac
          ls -lh input_song

      - name: Extract melody
        env:
          SEPARATE: ${{ inputs.separate }}
          LYRICS: ${{ inputs.lyrics }}
        run: |
          ARGS="--out out"
          [ "$SEPARATE" = "true" ] && ARGS="$ARGS --separate"
          [ "$LYRICS" = "true" ] && ARGS="$ARGS --lyrics"
          python src/analyze.py input_song $ARGS

      - name: Plan arrangement (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STYLE: ${{ inputs.style }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY לא מוגדר - מדלג על תכנון העיבוד"
          else
            python src/plan.py input_song --analysis out/analysis.json --out out/plan.json \
              --style "$STYLE" --model "$GEMINI_MODEL"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("out/plan.json", encoding="utf-8"))
          print("\n## תוכנית עיבוד\n")
          print(f"- סגנון: {p['style'].get('name')} ({'זוהה מההקלטה' if p['style'].get('detected_from_audio') else 'נקבע ידנית'})")
          print(f"- קצב: {p['rhythm'].get('feel')} | BPM: {p['rhythm'].get('bpm')}")
          print(f"- כלים: {', '.join(i['role'] for i in p['instruments'])}")
          for w in p.get('warnings', []):
              print(f"- אזהרה: {w}")
          PY
          fi

      - name: Show summary
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: melody
          path: out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SONG_URL: ${{ inputs.song_url }}
        run: |
          TAG="melody-${{ github.run_number }}"
          NAME=$(basename "${SONG_URL%%\?*}")
          cd out
          zip -qr melody.zip .
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "לחן: $NAME (#${{ github.run_number }})" \
            --notes-file summary.md \
            melody.zip melody.mid pitch_contour.csv analysis.json summary.md $(ls plan.json 2>/dev/null)
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
